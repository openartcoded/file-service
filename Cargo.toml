[package]
name = "kofte-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.83"
axum = { version = "0.7.7", features = ["multipart"] }
axum-extra = "0.9.4"
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
futures = "0.3.31"
futures-util = "0.3.31"
http-body-util = "0.1.2"
image = "0.25.5"
mime_guess = "2.0.5"
mongodb = "3.1.0"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
tokio = { version = "1.41.1", features = ["full"] }
tokio-util = "0.7.12"
tower-http = { version = "0.6.1", features = ["cors", "limit", "trace","redirect"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uuid = { version = "1.11.0", features = ["v4"] }

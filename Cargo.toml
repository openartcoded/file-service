[package]
name = "file-service"
version = "2027.0.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
async_zip = { version = "0.0.19", features = ["deflate", "tokio", "tokio-fs"] }
zip = "9.0.5"
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["query", "typed-header"] }
base64 = "0.23.1"
bson = { version = "3.1.0", features = ["serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
dirs = "7.0.0"
futures = "0.3.32"
futures-util = "0.3.32"
headless_chrome = { version = "1.0.22" }
http-body-util = "0.1.3"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
] }
mime_guess = "2.0.5"
# minijinja 3: serde is opt-in, the context goes through value::Serde
minijinja = { version = "3.1.0", default-features = false, features = [
    "builtins",
    "macros",
    "serde",
    "speedups",
    "urlencode",
    "multi_template",       # include / import / extends of other templates
    "json",                 # tojson filter
    "loop_controls",        # break / continue
    "adjacent_loop_items",  # loop.previtem / loop.nextitem
    "preserve_order",       # maps keep the order of the json they come from
    "std_collections",
    "fuel",                 # stops runaway templates (TEMPL_FUEL)
    "debug",                # errors show the template line and the variables
    "stacker",              # deep recursion (macros) without stack overflow
] }
minijinja-contrib = { version = "3.1.0", features = [
    "datetime",  # dateformat, datetimeformat, timeformat, now() (strftime formats)
    "timezone",
    "pycompat",  # python methods: "x".upper(), d.items(), "{}".format(x)...
    "rand",      # random, randrange, lipsum
    "wordwrap",
] }
mongodb = "3.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
time = { version = "0.3.47", features = [
    "formatting",
    "local-offset",
    "macros",
] }
tokio = { version = "1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "fs",
    "time",
] }
tokio-util = { version = "0.7.18", features = ["io"] }
#tower-http = { version = "0.6.6", features = [
#    "cors",
#    "limit",
#    "trace",
#    "redirect",
#] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "time",
    "local-time",
] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", default-features = false, features = [
    "axum",
] }
uuid = { version = "1.23.0", features = ["v7"] }

[profile.release]
lto = "thin"
debug = 0
strip = "debuginfo"
opt-level = "s"

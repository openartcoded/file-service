[package]
name = "file-service"
version = "2026.0.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
async_zip = { version = "0.0.18", features = ["deflate", "tokio", "tokio-fs"] }
axum = { version = "0.8.6", features = ["multipart"] }
axum-extra = { version = "0.12.1", features = ["query", "typed-header"] }
base64 = "0.22.1"
bson = { version = "3.0.0", features = ["serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
dirs = "6.0.0"
futures = "0.3.31"
futures-util = "0.3.31"
headless_chrome = "1.0.18"
http-body-util = "0.1.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif",] }
mime_guess = "2.0.5"
minijinja = { version = "2.12.0", default-features = false, features = [
    "builtins",
    "macros",
    "serde",
    "speedups",
    "urlencode",
] }
minijinja-contrib = { version = "2.12.0", features = [
    "datetime",
    "timezone",
    "time-tz",
    "time",
] }
mongodb = "3.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.44", features = [
    "formatting",
    "local-offset",
    "macros",
] }
tokio = { version = "1.48.0", features = ["macros", "sync", "fs", "time"] }
tokio-util = "0.7.17"
#tower-http = { version = "0.6.6", features = [
#    "cors",
#    "limit",
#    "trace",
#    "redirect",
#] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "time",
    "local-time",
] }
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0.2", default-features = false,features = ["axum"] }
uuid = { version = "1.18.1", features = ["v7"] }

[profile.release]
lto = "thin"
debug = 0
strip = "debuginfo"
opt-level = "s"

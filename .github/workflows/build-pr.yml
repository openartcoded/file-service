name: publish-branch-dev

on:
  push:
    branches:
      - "develop"
      - "feat/**"
      - "chore/**"
      - "feature/**"

# a new push on the branch replaces the build in progress
concurrency:
  group: branch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Get branch name
        id: branch_name
        run: echo "branch_name=${GITHUB_REF##*/}" | sed 's/\//-/g' >> $GITHUB_ENV
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64
          tags: nbittich/file-service:feature-${{ env.branch_name }}
          # starts from the main amd64 cache (dependencies already built), writes to its own cache
          cache-from: |
            type=registry,ref=nbittich/file-service:buildcacheamd64
            type=registry,ref=nbittich/file-service:buildcache
          cache-to: type=registry,ref=nbittich/file-service:buildcache,mode=max

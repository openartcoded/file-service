name: publish-branch-dev

on:
  push:
    branches:
      - "develop"
      - "feat/**"
      - "chore/**"
      - "feature/**"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Get branch name
        id: branch_name
        run: echo "branch_name=${GITHUB_REF##*/}" | sed 's/\//-/g' >> $GITHUB_ENV
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          platforms: linux/amd64 #,linux/arm64
          tags: nbittich/file-service:feature-${{ env.branch_name }}
          cache-from: type=registry,ref=nbittich/file-service:buildcache
          cache-to: type=registry,ref=nbittich/file-service:buildcache,mode=max
